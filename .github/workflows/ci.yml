name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 rather than macos-latest: see the same pin in claude-wrapper's CI.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Plugins
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --workspace
          TROVADOR_BIN=$PWD/target/debug/trovador TOSI_BIN=$PWD/target/debug/tosi scripts/check.sh

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-version in each crate's Cargo.toml.
          toolchain: "1.90.0"
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "msrv"
      - name: Check MSRV
        run: cargo check --workspace --all-targets

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --workspace --no-deps
