[package]
# Bottega installs from source; none of its crates are published.
publish = false
name = "trovador"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Search, read, continue, and consult local Claude Code and Codex sessions, as one MCP server and CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/bottega"
homepage = "https://github.com/joshrotenberg/bottega"
readme = "README.md"
keywords = ["claude", "codex", "mcp", "agents", "sessions"]
categories = ["command-line-utilities", "development-tools"]
# Planning notes, parity scripts, and live tests are for this repository, not the crate.
exclude = ["docs/", "scripts/", ".github/", "AGENTS.md", "CLAUDE.md"]

[[bin]]
name = "trovador"
path = "src/main.rs"

[dependencies]
bottega-core.workspace = true
anyhow = "1.0.104"
clap = { workspace = true }
claude-wrapper = { workspace = true }
codex-wrapper = { workspace = true }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
humantime = { workspace = true }
memchr = "2.8.3"
regex = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower-mcp = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower-mcp = { workspace = true, features = ["testing"] }
