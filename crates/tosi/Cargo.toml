[package]
# Bottega installs from source; none of its crates are published.
publish = false
name = "tosi"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Short-lived Claude and Codex tasks over MCP"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
clap = { workspace = true }
claude-wrapper = { workspace = true }
codex-wrapper = { workspace = true }
jsonschema = { version = "0.56", default-features = false }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-mcp = { workspace = true }
# Provenance and redaction stay shared across services.
bottega-core.workspace = true
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
trovador = { path = "../trovador" }
tower-mcp = { workspace = true, features = ["testing"] }
