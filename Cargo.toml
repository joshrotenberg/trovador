[package]
name = "trovador"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Search and read local Claude Code and Codex session history, as one CLI and MCP server"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/trovador"
homepage = "https://github.com/joshrotenberg/trovador"
documentation = "https://docs.rs/trovador"
readme = "README.md"
keywords = ["claude", "codex", "mcp", "agents", "sessions"]
categories = ["command-line-utilities", "development-tools"]
# Planning notes, parity scripts, and live tests are for this repository, not the crate.
exclude = ["docs/", "scripts/", ".github/", "AGENTS.md", "CLAUDE.md"]

[[bin]]
name = "trovador"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
memchr = "2.8.3"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros"] }
tower-mcp = "=0.23.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
uuid = { version = "1.27.0", features = ["v4"] }
tower-mcp = { version = "=0.23.2", features = ["testing"] }

[profile.release]
lto = "thin"
strip = true
