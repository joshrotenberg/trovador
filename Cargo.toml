[package]
name = "trovador"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Local Claude Code and Codex sessions as one MCP server and CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/trovador"
publish = false

[[bin]]
name = "trovador"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "fs", "sync"] }
tower-mcp = "0.23.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
